name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update contribution map]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check site sources
        run: node scripts/check-project.mjs
      - name: Prepare public files
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
